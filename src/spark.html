<title>Spark iOS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: presenter stage (dark studio) with a scaled iPhone 17 Pro frame (402×874) on the right, flow shortcuts on the left. */
:root{
  --stage:#141417; --stage-2:#1d1d22; --stage-fg:#e9e9ee; --stage-dim:#8b8b96;
  --bg:#0A0A0C; --fg:#ffffff; --fg2:rgba(255,255,255,.6); --fg3:rgba(255,255,255,.4);
  --lime:#EDFF3E; --lime-2:#DDF02F; --green:#34C759; --red:#FF383C; --yellow:#FFCC00; --blue:#0088FF;
  --chip:rgba(118,118,128,.24); --card:rgba(255,255,255,.08); --group:rgba(255,255,255,.06); --sheet:#1C1C1E; --div:rgba(255,255,255,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--stage-fg);font-family:var(--font);margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- presenter panel ---------- */
.panel{width:280px;flex:none;display:flex;flex-direction:column;gap:18px;max-height:100%;overflow:auto;padding-right:4px}
.panel h1{font-size:22px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.panel h1 i{width:28px;height:28px;border-radius:8px;background:var(--lime);display:grid;place-items:center;color:#000;font-style:normal;font-size:16px}
.panel p{margin:0;color:var(--stage-dim);font-size:13px;line-height:1.45}
.pgroup{display:flex;flex-direction:column;gap:6px}
.pgroup h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stage-dim);margin:0 0 2px;font-weight:600}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:9px 12px;border-radius:10px;background:var(--stage-2);font-size:13.5px;border:1px solid transparent}
.pbtn:hover{border-color:#34343c}
.pbtn:focus-visible,.app button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.pbtn small{color:var(--stage-dim);font-size:11px}
.ptoggle{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--stage-2);font-size:13.5px;gap:8px}
.ptoggle input{accent-color:var(--lime);width:16px;height:16px}
.missing{font-size:12.5px;color:var(--stage-dim);margin:0;padding-left:16px;line-height:1.6}
@media (max-width:860px){.panel{display:none}.stage{padding:0;gap:0}}

/* ---------- device ---------- */
.device-wrap{flex:none;position:relative}
.device{position:relative;width:426px;height:898px;border-radius:68px;background:#000;padding:12px;box-shadow:0 0 0 2px #3a3a40,0 0 0 9px #1a1a1e,0 40px 120px rgba(0,0,0,.6);transform-origin:top left}
.island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:200}
@media (max-width:860px){.device{border-radius:0;padding:0;box-shadow:none;width:402px;height:874px}.island{display:none}}

/* ---------- app ---------- */
.app{position:relative;width:402px;height:874px;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;letter-spacing:-.01em;isolation:isolate}
@media (max-width:860px){.app{border-radius:0}}
.layer{position:absolute;inset:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hrow::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 36px 0 52px;font-weight:600;font-size:17px;z-index:150;pointer-events:none;color:#fff}
.statusbar .sb-ic{display:flex;gap:7px;align-items:center}
.tabview{position:absolute;inset:0}
.tabview[hidden]{display:none!important}

/* glass */
.glass{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.1)}
.glass-dark{background:rgba(30,30,34,.55);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08)}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.circle svg{width:22px;height:22px}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:60px 16px 10px}
.toolbar.fade::before{content:"";pointer-events:none;position:absolute;inset:0 0 -24px;background:linear-gradient(var(--bg) 55%,rgba(10,10,12,0));z-index:-1;opacity:var(--tbfade,0);transition:opacity .2s}
.ltitle{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:41px;margin:0}
.tb-right{display:flex;gap:8px;align-items:center}
.pro{height:32px;padding:0 12px 0 10px;border-radius:999px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px;color:#111;background:linear-gradient(95deg,#F7C9EC 0%,#E6F5C9 50%,#C3E6FB 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 10px rgba(0,0,0,.25)}
.pro svg{width:18px;height:18px}
.balance{height:32px;padding:0 12px 0 6px;border-radius:999px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.balance img{width:22px;height:22px}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.2)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--chip);color:#fff;font-size:15px;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:background .15s,color .15s}
.chip.on{background:#fff;color:#000;font-weight:600}
.chip-arrow{width:36px;padding:0;justify-content:center}
.chip-arrow svg{width:16px;height:16px;transition:transform .2s}
.chip-arrow.open svg{transform:rotate(180deg)}

/* section */
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;padding:0 16px;letter-spacing:-.01em}
.sec-h svg{width:16px;height:16px;opacity:.6}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scroll-padding-inline:16px;scroll-snap-type:x proximity;scrollbar-width:none}
.hrow>*{scroll-snap-align:start}
.mcard{flex:none;width:132px;height:208px;border-radius:16px;overflow:hidden;position:relative;scroll-snap-align:start;background:#1b1b1f}
.mcard img,.mcard video{width:100%;height:100%;object-fit:cover}
.mcard .t{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;font-weight:600;font-size:15px;line-height:1.15;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72))}
.mcard:active{transform:scale(.98)}
.badge-dur{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.45)}

/* buttons */
.cta{height:50px;border-radius:999px;background:linear-gradient(180deg,#E6F830,#EDFF3E 60%,#F3FF62);color:#0A0A0C;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.08),0 6px 18px rgba(237,255,62,.12);transition:transform .1s,opacity .2s;width:100%}
.cta:active{transform:scale(.98)}
.cta[disabled]{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);cursor:default}
.cta[disabled] img{opacity:.4}
.cta img{width:20px;height:20px}
.cta .sep{opacity:.5}
.btn-glass{height:50px;border-radius:999px;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px}
.pillbtn{height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:4px}
.pillbtn.lime{background:var(--lime);color:#000}
.textlink{font-weight:600;font-size:15px;color:rgba(255,255,255,.7)}

/* tab bar */
.tabbar{position:absolute;left:16px;right:16px;bottom:22px;height:64px;border-radius:999px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:60;transition:transform .3s}
.tabbar.hide{transform:translateY(120px)}
.tab{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:#fff}
.tab svg{width:24px;height:24px}
.tab.on{background:rgba(255,255,255,.12);color:var(--lime)}
.edgefade{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(rgba(10,10,12,0),rgba(10,10,12,.85));pointer-events:none;z-index:50}

/* pushed screens */
.screen{pointer-events:auto;position:absolute;inset:0;background:var(--bg);z-index:80;transform:translateX(100%);transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.screen.in{transform:none}
.screen.modal{transform:translateY(100%)}
.screen.modal.in{transform:none}
.screen.under{transform:translateX(-25%)}
.navbar{position:absolute;top:0;left:0;right:0;z-index:30;height:118px;display:flex;align-items:flex-start;padding:64px 16px 0;justify-content:space-between}
.navbar .nt{position:absolute;left:72px;right:72px;top:78px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:120;opacity:0;transition:opacity .25s}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:121;background:var(--sheet);border-radius:32px 32px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.3,.7,.2,1);overflow:hidden;max-height:calc(100% - 56px);display:flex;flex-direction:column}
.sheet.in{transform:none}
.grabber{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);margin:8px auto 0;flex:none}
.sheet-body{overflow-y:auto;scrollbar-width:none}

/* toast */
.toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-140%);z-index:180;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;transition:transform .35s cubic-bezier(.3,.7,.2,1);white-space:nowrap;max-width:370px}
.toast.in{transform:translate(-50%,0)}
.toast img{width:20px;height:20px}

/* misc */
.dots{display:flex;gap:6px;justify-content:center;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:width .3s,background .3s}
.dots i.on{width:18px;background:#fff}
.segm{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.08)}
.segm button{height:28px;padding:0 12px;border-radius:999px;font-size:15px;color:rgba(255,255,255,.6);font-weight:500}
.segm button.on{background:rgba(255,255,255,.2);color:#fff}
.switch{width:64px;height:28px;border-radius:999px;background:rgba(120,120,128,.32);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:36px;height:24px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--green)}
.switch.on::after{left:26px}
.ico{width:24px;height:24px;flex:none}
.coin{width:16px;height:16px;vertical-align:-3px}
.dim{color:var(--fg2)}
.fn{font-size:13px}
.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
